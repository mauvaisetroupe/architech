name: Deploy Hugo to OVH
on:
  push:
    branches:
      - main 
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Important si tu utilises des thèmes en submodules
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true # Nécessaire pour la plupart des thèmes Hugo (SASS/SCSS)

      - name: Build Site
        run: hugo --minify

      - name: Sync to OVH (Delta Only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          # CHANGE LE CHEMIN CI-DESSOUS POUR CHAQUE SITE
          server-dir: ./architech/
          # Optionnel : supprime les fichiers sur OVH qui n'existent plus localement
          # delete-destination: true