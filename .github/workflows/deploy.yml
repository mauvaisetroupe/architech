name: Deploy Hugo to OVH
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout du repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Installer Node (REQUIS pour Docsy)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Installer les dépendances frontend (PostCSS, etc.)
      - name: Install dependencies
        run: npm install

      # 4. Installer Hugo (version stable recommandée)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 5. Build du site
      - name: Build Site
        env:
          HUGO_ENV: production
        run: hugo --minify

      # 6. Déploiement FTP vers OVH
      - name: Deploy to OVH (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ./architech/
          # delete-destination: true

      - name: Archive Sync State and Commit
        run: |
          # 1. Nom de fichier fixe pour éviter de polluer le repo
          FILENAME="architect-last-sync-state.json"
          mkdir -p ftp-synchro
          
          # 2. On récupère le fichier là où il a été généré
          if [ -f .ftp-deploy-sync-state.json ]; then
            cp .ftp-deploy-sync-state.json ftp-synchro/$FILENAME
          elif [ -f ./public/.ftp-deploy-sync-state.json ]; then
            cp ./public/.ftp-deploy-sync-state.json ftp-synchro/$FILENAME
          fi
          
          # 3. Commit et Push (si le fichier a changé)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ftp-synchro/$FILENAME
          
          # On vérifie s'il y a des changements pour éviter une erreur si rien n'a bougé
          if git diff --staged --quiet; then
            echo "Aucun changement dans l'état de synchro."
          else
            git commit -m "chore: update ftp sync state [skip ci]"
            git push
          fi